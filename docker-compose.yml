services:
  fnos-pack:
    image: ghcr.io/tough-jk/fn-packweb-docker:latest
    container_name: fnos-pack
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data/fnpack:/data/fnpack:ro
      - ./data/output:/data/output
      - ./data/cache:/data/cache
    environment:
      - FNPACK_PATH=/data/fnpack/fnpack
      - OUTPUT_ROOT=/data/output
      - TZ=Asia/Shanghai
